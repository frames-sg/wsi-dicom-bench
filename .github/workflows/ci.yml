name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  installed-package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Build wheel and source distribution
        run: |
          python -m pip install "build==1.3.0"
          python -m build
      - name: Test the installed wheel
        run: |
          python -m venv "${RUNNER_TEMP}/test-environment"
          "${RUNNER_TEMP}/test-environment/bin/python" -m pip install dist/*.whl
          "${RUNNER_TEMP}/test-environment/bin/python" -m pip install "numpy==2.4.4"
          env -u PYTHONPATH "${RUNNER_TEMP}/test-environment/bin/python" -m unittest discover -s tests
      - name: Generate the bundled suite from an unrelated directory
        shell: bash
        run: |
          python -m venv "${RUNNER_TEMP}/portable-environment"
          "${RUNNER_TEMP}/portable-environment/bin/python" -m pip install dist/*.whl
          portable_cwd="$(mktemp -d)"
          cd "${portable_cwd}"
          env -u PYTHONPATH "${RUNNER_TEMP}/portable-environment/bin/python" - "${RUNNER_TEMP}/generated-suite" <<'PY'
          import json
          import sys
          from importlib.resources import files
          from pathlib import Path

          from wsi_dicom_bench.negative_bench.generate import generate_challenge

          manifest = files("wsi_dicom_bench").joinpath(
              "negative_bench/manifest-v4.json"
          )
          output = Path(sys.argv[1])
          generate_challenge(Path(str(manifest)), output)
          document = json.loads((output / "manifest.json").read_text(encoding="utf-8"))
          assert len(document["valid_controls"]) == 14
          assert len(document["evaluation_cases"]) == 69
          assert len(list((output / "controls").iterdir())) == 14
          assert len(list((output / "cases").iterdir())) == 69
          PY
