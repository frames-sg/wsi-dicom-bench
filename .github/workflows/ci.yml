name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  installed-package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Build wheel and source distribution
        run: |
          python -m pip install "build==1.3.0"
          python -m build
      - name: Test the installed wheel
        env:
          WSI_DICOM_BENCH_RESERVED_WORDS: ${{ secrets.WSI_DICOM_BENCH_RESERVED_WORDS }}
        run: |
          python -m venv "${RUNNER_TEMP}/test-environment"
          "${RUNNER_TEMP}/test-environment/bin/python" -m pip install dist/*.whl
          "${RUNNER_TEMP}/test-environment/bin/python" -m pip install "numpy==2.4.4"
          env -u PYTHONPATH "${RUNNER_TEMP}/test-environment/bin/python" -m unittest discover -s tests
      - name: Generate the bundled v4, v5, and v6 suites from an unrelated directory
        shell: bash
        run: |
          python -m venv "${RUNNER_TEMP}/portable-environment"
          "${RUNNER_TEMP}/portable-environment/bin/python" -m pip install dist/*.whl
          portable_cwd="$(mktemp -d)"
          cd "${portable_cwd}"
          env -u PYTHONPATH "${RUNNER_TEMP}/portable-environment/bin/python" - "${RUNNER_TEMP}" <<'PY'
          import json
          import sys
          from importlib.resources import files
          from pathlib import Path

          from wsi_dicom_bench.negative_bench.generate import generate_challenge

          for version, case_count in (("v4", 69), ("v5", 149), ("v6", 352)):
              manifest = files("wsi_dicom_bench").joinpath(
                  f"negative_bench/manifest-{version}.json"
              )
              output = Path(sys.argv[1]) / f"generated-suite-{version}"
              generate_challenge(Path(str(manifest)), output)
              document = json.loads((output / "manifest.json").read_text(encoding="utf-8"))
              assert len(document["valid_controls"]) == 14
              assert len(document["evaluation_cases"]) == case_count
              assert len(list((output / "controls").iterdir())) == 14
              assert len(list((output / "cases").iterdir())) == case_count
          PY
